<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <title>صفحة واحد</title>
  <defs>
    <radialGradient id="wall" cx="400" cy="360" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1E1233"/>
      <stop offset="1" stop-color="#07050E"/>
    </radialGradient>
    <pattern id="bricks" width="80" height="40" patternUnits="userSpaceOnUse">
      <path d="M0 .5H80M0 20.5H80M40 0V20M0 20V40M80 20V40" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="2" fill="none"/>
    </pattern>
    <path id="spark" d="M0-1C.13-.13.13-.13 1 0C.13.13.13.13 0 1C-.13.13-.13.13-1 0C-.13-.13-.13-.13 0-1Z"/>
    <filter id="gAmber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="a"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="b"/>
      <feMerge result="m"><feMergeNode in="b"/><feMergeNode in="a"/></feMerge>
      <feFlood flood-color="#FFB83D"/>
      <feComposite in2="m" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gPink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="a"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="b"/>
      <feMerge result="m"><feMergeNode in="b"/><feMergeNode in="a"/></feMerge>
      <feFlood flood-color="#FF4F9A"/>
      <feComposite in2="m" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="a"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="b"/>
      <feMerge result="m"><feMergeNode in="b"/><feMergeNode in="a"/></feMerge>
      <feFlood flood-color="#3FE0FF"/>
      <feComposite in2="m" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#wall)"/>
  <rect width="800" height="800" fill="url(#bricks)"/>

  <!-- neon ring with a few breaks, like bent glass tube -->
