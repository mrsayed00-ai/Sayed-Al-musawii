<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Lalezar; src: url(assets/Lalezar-Regular.ttf); }
@font-face { font-family: Cairo; src: url(assets/Cairo.ttf); font-weight: 200 1000; }
@font-face { font-family: Pixel; src: url(assets/PressStart2P.ttf); }
:root {
  --p1: #7F71CE; --p2: #6851C5; --p3: #5230BB; --deep: #2A1680; --ink: #1A1440;
  --lav: #D2CDEA; --yellow: #F2A60F; --red: #E53A34; --green: #4AA44C; --kids: #2C91EC;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--p3); }
#f { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Cairo; color: #fff; }
.bg { position: absolute; inset: 0;
  background: linear-gradient(172deg, var(--p1) 0%, var(--p2) 34%, var(--p3) 68%, #3B1E9E 100%); }
.bgshot { position: absolute; inset: -40px; background-size: cover; background-position: center;
  filter: blur(18px) saturate(1.1); opacity: .55; }
.tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(82,48,187,.55), rgba(42,22,128,.85)); }
.glow { position: absolute; width: 900px; height: 900px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.42) 0%, rgba(255,255,255,.14) 38%, rgba(255,255,255,0) 68%);
  transform: translate(50%, -50%); }
.dither { position: absolute; inset: 0; opacity: .08;
  background-image: linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%),
                    linear-gradient(45deg, #fff 25%, transparent 25%, transparent 75%, #fff 75%);
  background-size: 16px 16px; background-position: 0 0, 8px 8px; }
.redwash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, rgba(229,58,52,0) 30%, rgba(229,58,52,.55) 100%); }

.heading { position: absolute; top: 262px; right: 70px; left: 70px; display: flex; align-items: center;
  justify-content: center; gap: 26px; }
.heading h1 { margin: 0; font: 400 118px/1.05 Lalezar; text-shadow: 0 8px 0 var(--deep); white-space: nowrap; }
.step { font: 30px Pixel; color: var(--ink); background: var(--yellow); padding: 16px 18px 12px;
  box-shadow: 0 6px 0 var(--deep); }

.device { position: absolute; background: #0D0A1C; padding: 14px;
  box-shadow: 0 26px 60px rgba(13,6,48,.55), 0 0 0 3px rgba(255,255,255,.28); }
.device img { display: block; width: 100%; height: 100%; object-fit: cover; }
.host { border-radius: 34px; } .host img, .host .ph { border-radius: 22px; }
.phone { border-radius: 52px; } .phone img, .phone .ph { border-radius: 38px; }
.ph { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; text-align: center; padding: 28px;
  border: 5px dashed rgba(255,255,255,.85);
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.10) 0 20px, rgba(255,255,255,0) 20px 40px), #2A1A72; }
.ph b { font: 900 40px/1.2 Cairo; color: var(--yellow); direction: ltr; }
.ph span { font: 800 34px/1.35 Cairo; }
.ph i { font: 600 26px/1.3 Cairo; font-style: normal; opacity: .85; }

.cap { position: absolute; right: 140px; left: 140px; bottom: 500px; text-align: center; }
.cap div { display: inline; font: 900 54px/1.5 Cairo; padding: 6px 22px; background: rgba(34,16,110,.86);
  box-decoration-break: clone; -webkit-box-decoration-break: clone; box-shadow: 0 6px 0 rgba(13,6,48,.5); }
.hl { color: var(--yellow); }
.hlp { background: var(--p3); padding: 0 10px; border-radius: 10px; }
.kw { position: absolute; bottom: 502px; right: 150px; left: 410px; text-align: center; font: 400 76px/1.25 Lalezar;
  text-shadow: 0 6px 0 var(--deep); }

.bubble { position: absolute; top: 250px; right: 70px; left: 70px; background: #4734B4; border: 6px solid #fff;
  padding: 28px 30px 30px; text-align: center; font: 900 70px/1.4 Cairo; box-shadow: 10px 10px 0 var(--deep); }
.bubble:after { content: ""; position: absolute; bottom: -42px; left: 46%; width: 36px; height: 36px;
  background: #4734B4; border-right: 6px solid #fff; border-bottom: 6px solid #fff; transform: rotate(45deg); }
.strip { position: absolute; right: 140px; left: 140px; background: var(--deep); color: #fff; border: 6px solid var(--yellow);
  text-align: center; font: 900 66px/1.4 Cairo; padding: 16px 24px; box-shadow: 0 8px 0 var(--deep); }
.big { position: absolute; right: 140px; left: 140px; text-align: center; font: 400 130px/1.2 Lalezar;
  text-shadow: 0 10px 0 var(--deep); }
.dim { opacity: .5; font-size: 96px; }
.stamp { position: absolute; right: 160px; left: 160px; text-align: center; font: 400 128px/1.15 Lalezar;
  background: var(--red); padding: 20px 10px 6px; transform: rotate(-4deg); border: 8px solid #fff;
  text-shadow: -6px 0 0 rgba(0,229,255,.55), 6px 0 0 rgba(255,0,90,.55); box-shadow: 0 14px 0 rgba(13,6,48,.5); }
.redtxt { color: #fff; text-shadow: 0 10px 0 #8E1612; }

.char { position: absolute; image-rendering: pixelated; }
.chip { position: absolute; font: 900 64px/1 Cairo; padding: 20px 36px; border: 6px solid #fff; box-shadow: 0 8px 0 rgba(13,6,48,.5); }
.meter { position: absolute; width: 380px; height: 70px; border: 6px solid #fff; background: rgba(13,6,48,.6); }
.meter i { position: absolute; top: 6px; bottom: 6px; right: 6px; background: repeating-linear-gradient(90deg, var(--red) 0 28px, #ff7a72 28px 34px); }
.meter b { position: absolute; top: -66px; right: 0; font: 400 54px Lalezar; }
.tile { position: absolute; background: #0D0A1C; padding: 10px; border-radius: 26px; box-shadow: 0 18px 40px rgba(13,6,48,.5), 0 0 0 3px rgba(255,255,255,.28); }
.tile img { width: 100%; height: 100%; object-fit: cover; border-radius: 16px; display: block; }
.tile em { position: absolute; bottom: -22px; right: 50%; transform: translateX(50%); font: 400 44px/1 Lalezar; font-style: normal;
  background: var(--yellow); color: var(--ink); padding: 12px 18px 6px; white-space: nowrap; box-shadow: 0 6px 0 var(--deep); }
.logo { position: absolute; left: 50%; transform: translateX(-50%); filter: drop-shadow(0 10px 0 rgba(42,22,128,.6)); }
.url { position: absolute; left: 50%; transform: translateX(-50%); background: #fff; color: var(--p3); direction: ltr;
  font: 900 70px/1 Cairo; padding: 26px 56px; border-radius: 999px; box-shadow: 0 10px 0 var(--deep); white-space: nowrap; }
.illus { position: absolute; font: 700 24px Cairo; opacity: .9; }
.px { position: absolute; }
.note { position: absolute; font: 700 26px/1.3 Cairo; background: rgba(13,6,48,.75); padding: 8px 14px; border-radius: 10px; }

/* storyboard-only overlay: platform UI zones (TikTok / Reels) */
.safe div { position: absolute; background: repeating-linear-gradient(135deg, rgba(0,0,0,.20) 0 14px, rgba(0,0,0,.08) 14px 28px); }
.safe span { position: absolute; font: 700 24px Cairo; color: rgba(255,255,255,.8); }
</style>
</head>
<body><div id="f"></div>
<script>
const $ = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; };
const latin = (s) => s.replace(/[A-Za-z][A-Za-z .]*[A-Za-z]/g, (m) => `<bdi dir="ltr" style="white-space:nowrap">${m}</bdi>`);
const hl = (s) => latin(s).replace(/\[\[(.+?)\]\]/g, '<span class="hl">$1</span>').replace(/\{\{(.+?)\}\}/g, '<span class="hlp">$1</span>');

function device(kind, spec, box) {
  const [x, y, w, h] = box;
  const d = $(`<div class="device ${kind}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"></div>`);
  if (spec.img) d.appendChild($(`<img src="assets/${spec.img}" style="object-position:${spec.pos || 'center'}">`));
  else d.appendChild($(`<div class="ph"><b>${spec.code}</b><span>${spec.desc}</span><i>مكان شاشة ناقصة — مطلوب لقطة ثابتة بالجودة الأصلية</i></div>`));
  return d;
}

function pixels(f, seed, color, n, area) {
  let s = seed;
  const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < n; i++) {
    const size = 60 + Math.floor(r() * 3) * 30;
    const x = area[0] + Math.floor(r() * (area[2] - size) / 30) * 30;
    const y = area[1] + Math.floor(r() * (area[3] - size) / 30) * 30;
    f.appendChild($(`<div class="px" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px;background:${color}"></div>`));
  }
}

function charImg(f, state, scale, x, y, tall) {
  const w = 48 * scale, h = (tall ? 100 : 60) * scale;
  f.appendChild($(`<img class="char" src="assets/char_${state}${tall ? '_tall' : ''}.png" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">`));
}

function render(sc, v, opts) {
  const f = document.getElementById('f');
  f.innerHTML = '';
  f.appendChild($('<div class="bg"></div>'));
  const bgs = v === 'V1' ? sc.bgshotV1 : sc.bgshot;
  if (bgs) { f.appendChild($(`<div class="bgshot" style="background-image:url(assets/${bgs})"></div>`)); f.appendChild($('<div class="tint"></div>')); }
  const g = sc.glow || [540, 900];
  f.appendChild($(`<div class="glow" style="right:${1080 - g[0]}px;top:${g[1]}px"></div>`));
  f.appendChild($('<div class="dither"></div>'));
  if (sc.redwash) f.appendChild($('<div class="redwash"></div>'));
  if (sc.pixels) pixels(f, sc.pixels.seed, sc.pixels.color, sc.pixels.n, sc.pixels.area);

  const V1 = v === 'V1';
  const L = sc.layout;

  if (sc.heading) {
    const h = $(`<div class="heading"><h1>${latin(sc.heading.text)}</h1><span class="step" style="background:${sc.heading.color || 'var(--yellow)'};color:${sc.heading.ink || 'var(--ink)'}">${sc.heading.step}</span></div>`);
    f.appendChild(h);
  }

  if (L === 'hook') {
    const k = V1 ? sc.v1 : sc.v2;
    if (V1) {
      if (k.bubble) f.appendChild($(`<div class="bubble">${hl(k.bubble)}</div>`));
      if (k.strip) f.appendChild($(`<div class="strip" style="top:${k.stripTop || 560}px">${hl(k.strip)}</div>`));
      if (k.stamp) f.appendChild($(`<div class="stamp" style="top:${k.stampTop || 330}px">${k.stamp}</div>`));
      charImg(f, k.char, 13, 540 - 24 * 13, k.charTop || 760, true);
    } else {
      (k.lines || []).forEach((ln, i) => f.appendChild($(`<div class="big ${ln.dim ? 'dim' : ''}" style="top:${ln.top}px">${hl(ln.t)}</div>`)));
      if (k.stamp) f.appendChild($(`<div class="stamp" style="top:${k.stampTop || 760}px">${k.stamp}</div>`));
      if (k.logo) f.appendChild($(`<img class="logo" src="assets/fanous_wordmark_white.png" style="top:${k.logo.top}px;width:${k.logo.w}px">`));
    }
  }

  if (L === 'stage') {
    const st = V1 ? (sc.stageV1 || sc.stage) : sc.stage;
    for (const d of st) f.appendChild(device(d.kind, d, d.box));
    for (const e of ((V1 ? sc.extrasV1 : sc.extrasV2) || sc.extras || [])) {
      if (e.type === 'big') f.appendChild($(`<div class="big ${e.cls || ''}" style="top:${e.top}px;font-size:${e.size || 130}px">${hl(e.t)}</div>`));
      if (e.type === 'chip') f.appendChild($(`<div class="chip" style="left:${e.x}px;top:${e.y}px;background:${e.bg};transform:rotate(${e.rot || 0}deg)">${e.t}</div>`));
      if (e.type === 'meter') f.appendChild($(`<div class="meter" style="left:${e.x}px;top:${e.y}px"><b>الشك</b><i style="width:${e.fill}%"></i></div>`));
      if (e.type === 'illus') f.appendChild($(`<div class="illus" style="left:${e.x}px;top:${e.y}px;transform:scale(${e.scale || 1});transform-origin:top left">${e.html}</div>`));
      if (e.type === 'blind') {
        f.appendChild($(`<img class="char" src="assets/blind/static.png" style="left:${e.x}px;top:${e.y}px;width:${64 * e.scale}px;height:${40 * e.scale}px">`));
      }
      if (e.type === 'note') f.appendChild($(`<div class="note" style="left:${e.x}px;top:${e.y}px">${e.t}</div>`));
    }
    if (V1) {
      charImg(f, sc.char || 'neutral_half', 7, 40, 1020, false);
      if (sc.kw) f.appendChild($(`<div class="kw">${hl(sc.kw)}</div>`));
    } else if (sc.cap) {
      f.appendChild($(`<div class="cap"><div>${hl(sc.cap)}</div></div>`));
    }
  }

  if (L === 'tiles') {
    for (const t of sc.tiles) {
      const [x, y, w, h] = V1 ? t.boxV1 : t.box;
      f.appendChild($(`<div class="tile" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="assets/${V1 ? (t.imgV1 || t.img) : t.img}" style="object-position:${t.pos || 'center'}"><em>${t.label}</em></div>`));
    }
    if (V1) {
      f.appendChild($(`<div class="bubble" style="top:250px;font-size:60px">${hl(sc.cap)}</div>`));
      charImg(f, sc.char, 10, 540 - 240, 1010, true);
    } else {
      f.appendChild($(`<div class="cap"><div>${hl(sc.cap)}</div></div>`));
    }
  }

  if (L === 'end') {
    f.appendChild($(`<img class="logo" src="assets/fanous_wordmark_white.png" style="top:${V1 ? 300 : 420}px;width:${V1 ? 640 : 780}px">`));
    f.appendChild($(`<div class="big" style="top:${V1 ? 560 : 760}px;font-size:104px">${hl(sc.cta)}</div>`));
    f.appendChild($(`<div class="url" style="top:${V1 ? 730 : 960}px">alfanous.app</div>`));
    if (V1) {
      charImg(f, sc.char, 10, 540 - 240, 960, true);
      f.appendChild($(`<div class="note" style="left:90px;top:880px">يلوّح ويشير للرابط (حركة اليد تُرسم في المرحلة 2)</div>`));
    }
  }

  if (opts && opts.safe) {
    const s = $('<div class="safe"></div>');
    s.appendChild($('<div style="left:0;right:0;top:0;height:230px"></div>'));
    s.appendChild($('<div style="left:0;right:0;top:1440px;bottom:0"></div>'));
    s.appendChild($('<div style="left:940px;right:0;top:700px;height:740px"></div>'));
    s.appendChild($('<span style="right:30px;top:1460px">منطقة واجهة المنصة — لا نص مهم هنا</span>'));
    f.appendChild(s);
  }
}
window.render = render;
</script>
</body>
</html>
